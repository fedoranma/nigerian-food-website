<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herbs, Spices & Seeds - HealthyLife</title>
<link rel="stylesheet" href="food.css">
<style>
.tabs{display:flex;justify-content:center;gap:12px;margin:10px 0 5px 0;}
.tab-btn{
  padding:10px 22px;border-radius:20px;border:1px solid #3a5a2c;
  background:#fff;color:#3a5a2c;font-weight:bold;cursor:pointer;
}
.tab-btn.active{background:#3a5a2c;color:#fff;}
</style>
</head>
<body>
<header class="top-header">
<div class="logo" style="cursor:pointer;" onclick="location.href='food.html'">← Back Home</div>
<button id="themeBtn">DARK</button>
</header>

<h1 style="text-align:center; margin-top:20px;">Herbs, Spices & Seeds (40+)</h1>

<div class="tabs">
  <button class="tab-btn active" id="herbsBtn" onclick="switchTab('herbs')">🌿 HERBS (20+)</button>
  <button class="tab-btn" id="spicesBtn" onclick="switchTab('spices')">🧂 SPICES & SEEDS (20+)</button>
</div>

<div class="search-box" style="text-align:center; padding:15px;">
<input type="text" id="itemSearch" placeholder="Search like Scent Leaf, Ehuru, Uda..." style="padding:10px; width:80%; max-width:400px; border-radius:10px; border:1px solid #ccc;">
</div>

<div id="itemsGrid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:20px; padding:20px;"></div>

<script>

  {name:"Scent Leaf", tribe:"Nchanwu (Igbo), Efirin (Yoruba)", benefit:"Treats malaria, cold, stomach pain", img:"../images/scent-leaf.png"},
  {name:"Bitter Leaf", tribe:"Onugbu (Igbo), Ewuro (Yoruba)", benefit:"Lowers sugar, cleans liver", img:"../images/bitter-leaf.jpg"},
  {name:"Utazi Leaf", tribe:"Utazi (Igbo)", benefit:"Controls blood sugar, aids digestion", img:"../images/utazi copy.jpg"},
  {name:"Uziza Leaf", tribe:"Uziza (Igbo)", benefit:"Good for cough, fertility", img:"../images/uziza-leaf.jpg"},
  {name:"Curry Leaf", tribe:"Curry (All)", benefit:"Lowers cholesterol, good for hair", img:"../images/curry-leaf.jpg"},
  {name:"Moringa Leaf", tribe:"Moringa (All)", benefit:"Super food, high iron & vitamin", img:"../images/moringa-leaf.webp"},
  {name:"Neem Leaf", tribe:"Dogonyaro (Hausa)", benefit:"Treats skin infection, malaria", img:"../images/neem-leaf.jpg"},
  {name:"Guava Leaf", tribe:"Guava (All)", benefit:"Stops diarrhea, good for teeth", img:"../images/guava-leaf.jpg"},
  {name:"Pawpaw Leaf", tribe:"Papaya (All)", benefit:"Boosts platelets, treats malaria", img:"../images/pawpaw-leaf.webp"},
  {name:"Mango Leaf", tribe:"Mango (All)", benefit:"Controls diabetes, good for lungs", img:"../images/mango-leaf.jpg"},
  {name:"Hibiscus Leaf", tribe:"Zobo leaf (Hausa)", benefit:"Lowers blood pressure", img:"../images/hibiscus-leaf.jpg"},
  {name:"Lemon Grass", tribe:"Achara ehi (Igbo), Kooko oba (Yoruba)", benefit:"Calms anxiety, good for fever", img:"../images/lemongrass.jpg"},
  {name:"Aloe Vera", tribe:"Aloe (All)", benefit:"Treats burn, constipation", img:"../images/aloe-vera.jpg"},
  {name:"Mint Leaf", tribe:"Mint (All)", benefit:"Good for cold, fresh breath", img:"../images/mint-leaf.jpg"},
  {name:"African Basil", tribe:"Nchanwu (Igbo)", benefit:"Treats cough, headache", img:"../images/basil.jpg"},
  {name:"Ugu Leaf", tribe:"Fluted Pumpkin (Igbo)", benefit:"Builds blood, rich iron", img:"../images/ugu-leaf.jpg"},
  {name:"Waterleaf", tribe:"Gbure (Yoruba)", benefit:"Lowers blood pressure, hydrates", img:"../images/waterleaf.jpg"},
  {name:"Bitter Gourd Leaf", tribe:"Ejirin (Yoruba)", benefit:"Lowers sugar, purifies blood", img:"../images/bitter-gourd-leaf.jpg"},
  {name:"Soursop Leaf", tribe:"Soursop (All)", benefit:"Anti-cancer, good for sleep", img:"../images/soursop-leaf.jpg"},
  {name:"Avocado Leaf", tribe:"Avocado (All)", benefit:"Treats ulcer, lowers BP", img:"../images/avocado-leaf.jpg"},
  {name:"Oha Leaf", tribe:"Oha / Ora (Igbo)", benefit:"Rich fiber, good for digestion", img:"../images/oha-leaf.png"}
];

const spices = [
  {name:"Ehuru", tribe:"Calabash Nutmeg (Igbo)", benefit:"Spice for pepper soup, good for digestion", img:"../images/ehuru.webp"},
  {name:"Uda", tribe:"Negro Pepper (Igbo)", benefit:"Treats cough, after-birth cleansing", img:"../images/uda.jpg"},
  {name:"Uziza Seed", tribe:"Uziza (Igbo)", benefit:"Hot spice, good for cold", img:"../images/uziza-seed.jpg"},
  {name:"Alligator Pepper", tribe:"Ose Oji (Igbo), Atare (Yoruba)", benefit:"Good for digestion, energy", img:"../images/alligator-pepper.jpg"},
  {name:"Black Pepper", tribe:"Iyere (Yoruba)", benefit:"Boosts metabolism", img:"../images/black-pepper.jpg"},
  {name:"Ginger", tribe:"Jinja (All)", benefit:"Anti-nausea, good for cold", img:"../images/ginger.jpg"},
  {name:"Garlic", tribe:"Ayu (Hausa)", benefit:"Lowers BP, good for heart", img:"../images/garlic.jpg"},
  {name:"Turmeric", tribe:"Atale (Yoruba), Kurkuma (Hausa)", benefit:"Anti-inflammatory, bright skin", img:"../images/turmeric.jpg"},
  {name:"Cloves", tribe:"Kanafuru (Hausa)", benefit:"Good for toothache, digestion", img:"../images/cloves.webp"},
  {name:"Ogiri / Iru", tribe:"Dawadawa (Hausa)", benefit:"Rich protein, natural seasoning", img:"../images/ogiri.jpg"},
  {name:"Cinnamon", tribe:"Cinnamon (All)", benefit:"Lowers sugar, good for brain", img:"../images/cinnamon.jpg"},
  {name:"Nutmeg", tribe:"Nutmeg (All)", benefit:"Good for sleep, digestion", img:"../images/nutmeg.jpg"},
  {name:"Anise Seed", tribe:"Anise (All)", benefit:"Treats cough, aids sleep", img:"../images/anise.jpg"},
  {name:"Fennel Seed", tribe:"Fennel (All)", benefit:"Good for bloating, eyes", img:"../images/fennel.webp"},
  {name:"Cumin", tribe:"Cumin (All)", benefit:"Weight loss, digestion", img:"../images/cumin.jpg"},
  {name:"Coriander Seed", tribe:"Coriander (All)", benefit:"Lowers sugar, good for skin", img:"../images/coriander.jpg"},
  {name:"Cardamom", tribe:"Cardamom (All)", benefit:"Fresh breath, lowers BP", img:"../images/cardamom.jpg"},
  {name:"Baobab Seed", tribe:"Kuka (Hausa)", benefit:"High fiber, Vitamin C", img:"../images/baobab-seed.jpg"},
  {name:"Aidan / Tetrapleura", tribe:"Uyayak (Ibibio), Aridan (Yoruba)", benefit:"Good for womb cleansing", img:"../images/aidan.png"},
  {name:"Crayfish", tribe:"Crayfish (All)", benefit:"Rich protein, seasoning", img:"../images/crayfish.jpg"},
  {name:"Dried Pepper", tribe:"Shombo / Ata (Yoruba)", benefit:"Hot spice, metabolism", img:"../images/dried-pepper.jpg"},
  {name:"Curry Powder", tribe:"Curry (All)", benefit:"Mixed spices, flavor", img:"../images/curry-powder.webp"},
  {name:"Thyme", tribe:"Thyme (All)", benefit:"Good for cough, seasoning", img:"../images/thyme.jpg"},
  {name:"Bayleaf", tribe:"Bayleaf (All)", benefit:"Good for heart, aroma", img:"../images/bayleaf.webp"}
];


let currentList = herbs;
const grid = document.getElementById('itemsGrid');

function showItems(list){
  grid.innerHTML = "";
  list.forEach(f => {
    grid.innerHTML += `
    <div class="food-card">
      <img class="food-img-real" src="${f.img}" alt="${f.name}" style="width:100%; height:200px; object-fit:cover; border-radius:12px;">
      <div class="food-info" style="padding:10px;">
        <h3>${f.name}</h3>
        <p><b>Tribe:</b> ${f.tribe}</p>
        <p><b>Benefit:</b> ${f.benefit}</p>
      </div>
    </div>`;
  });
}

function switchTab(tab){
  if(tab === 'herbs'){
    currentList = herbs;
    document.getElementById('herbsBtn').classList.add('active');
    document.getElementById('spicesBtn').classList.remove('active');
  } else {
    currentList = spices;
    document.getElementById('spicesBtn').classList.add('active');
    document.getElementById('herbsBtn').classList.remove('active');
  }
  document.getElementById('itemSearch').value = "";
  showItems(currentList);
}

showItems(herbs);

document.getElementById('itemSearch').addEventListener('input', (e)=>{
  const v = e.target.value.toLowerCase();
  showItems(currentList.filter(f => f.name.toLowerCase().includes(v) || f.tribe.toLowerCase().includes(v)));
});
</script>
<script src="food.js"></script>
</body>
</html>
