function openDetail(food) {
    localStorage.setItem('selectedFoodData',
        JSON.stringify(food)
    );
location.href='food-detail.html';
}

const container = document.getElementById("foodsContainer");
const searchInput = document.getElementById("searchFood");

function showFoods(list){
container.innerHTML="";
list.forEach((food,i)=>{
container.innerHTML+=`
<div class="food-card" onclick='openDetail(${JSON.stringify(food).replace(/'/g,"&#39;")})'
style= "cursor:pointer;">
<img src="${food.img}" class="food-img-real" alt="${food.name}" onerror="this.src='https://via.placeholder.com/400x250?text=${food.name}'">
<h3>${food.name}</h3>
<p class="english-name"><i>${food.english}</i></p>
<span class="tribe">${food.tribe}</span>
<p>${food.benefit}</p>
<button onclick="goDetails(${i})">View Benefits</button>
</div>
`;
});
}
function goDetails(i){
localStorage.setItem("selectedFood", JSON.stringify(foods[i]));
localStorage.setItem("selectedType", "food");
window.location.href="food-details.html";
}
showFoods(foods);
searchInput.addEventListener("input", function(){
let v=this.value.toLowerCase();
let f=foods.filter(x=>x.name.toLowerCase().includes(v)||x.english.toLowerCase().includes(v)||x.benefit.toLowerCase().includes(v));
showFoods(f);
});
</script>
